<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --w:1080px; --h:1080px;
    --bg1:#070d1a; --bg2:#101e38;
    --line:rgba(255,255,255,.12);
    --title:#ffffff;
    --text:#c3d0e2;
    --muted:#8fa2bd;
    --accent:#38bdf8;
    --accent2:#2563eb;
    --heart1:#fb7185;
    --heart2:#e11d48;
  }
  body.light{
    --bg1:#ffffff; --bg2:#e8eef8;
    --line:#dce5f1;
    --title:#0b1728;
    --text:#42536b;
    --muted:#6b7b93;
    --accent:#1d4ed8;
    --accent2:#0ea5e9;
    --heart1:#f43f5e;
    --heart2:#be123c;
  }
  html,body{width:var(--w);height:var(--h)}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg1);color:var(--text);
    -webkit-font-smoothing:antialiased;overflow:hidden}
  .stage{position:relative;width:var(--w);height:var(--h);overflow:hidden;
    background:
      radial-gradient(760px 560px at 88% 6%, rgba(56,189,248,.20), transparent 62%),
      radial-gradient(700px 520px at 2% 100%, rgba(37,99,235,.22), transparent 62%),
      linear-gradient(155deg, var(--bg1) 0%, var(--bg2) 60%, var(--bg1) 100%)}
  body.light .stage{
    background:
      radial-gradient(760px 560px at 88% 4%, rgba(14,165,233,.14), transparent 62%),
      radial-gradient(700px 520px at 2% 100%, rgba(29,78,216,.12), transparent 62%),
      linear-gradient(155deg, #ffffff 0%, #eef3fb 58%, #ffffff 100%)}
  .glow{position:absolute;width:620px;height:620px;left:50%;top:44%;transform:translate(-50%,-50%);
    border-radius:50%;background:radial-gradient(circle, rgba(225,29,72,.20), transparent 65%)}
  body.light .glow{background:radial-gradient(circle, rgba(244,63,94,.12), transparent 65%)}
  .grid{position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:60px 60px;
    -webkit-mask-image:radial-gradient(circle at 70% 20%, #000 25%, transparent 75%)}
  body.light .grid{background-image:linear-gradient(rgba(11,23,40,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(11,23,40,.05) 1px,transparent 1px)}

  /* carretera sutil al fondo */
  .dashes{position:absolute;left:80px;right:80px;bottom:262px;height:6px;border-radius:99px;
    background:repeating-linear-gradient(90deg,var(--accent) 0 46px,transparent 46px 92px);opacity:.28}

  .inner{position:relative;height:100%;display:flex;flex-direction:column;padding:76px 80px 70px}

  .eyebrow{display:flex;align-items:center;gap:16px;font-family:'Poppins',sans-serif;
    font-size:21px;font-weight:700;letter-spacing:7px;text-transform:uppercase;color:var(--accent)}
  .eyebrow i{display:block;width:58px;height:5px;border-radius:99px;
    background:linear-gradient(90deg,var(--accent2),var(--accent))}

  .sp1{flex:1.15}
  .sp2{flex:1}

  h1{font-family:'Poppins',sans-serif;font-weight:800;font-size:96px;line-height:1.1;
    letter-spacing:-2.6px;color:var(--title);max-width:900px}
  h1 .heart{display:inline-block;width:88px;height:88px;vertical-align:-14px;margin:0 4px 0 22px}
  h1 .heart svg{width:100%;height:100%;display:block;
    filter:drop-shadow(0 12px 30px rgba(225,29,72,.42))}
  h1 em{font-style:normal;color:var(--accent)}

  .foot{padding-top:32px;border-top:1px solid var(--line);
    display:flex;align-items:flex-end;justify-content:space-between}
  .lockup{display:flex;align-items:center;gap:18px}
  .lockup svg{width:92px;color:var(--title)}
  body.light .lockup svg{color:var(--accent)}
  .lockup .wm{font-family:'Poppins',sans-serif;font-weight:800;font-size:46px;letter-spacing:-1px;
    color:var(--title);line-height:1}
  .lockup .wm span{color:var(--accent)}
  .tag{text-align:right;font-family:'Poppins',sans-serif;font-weight:600;font-size:26px;
    line-height:1.2;white-space:nowrap;color:var(--muted)}
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="dashes"></div>
  <div class="inner">

    <div class="eyebrow"><i></i>Nota</div>

    <div class="sp1"></div>

    <h1>Hecho con el<span class="heart"><svg viewBox="0 0 24 24" aria-label="coraz&oacute;n" role="img"><defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--heart1)"/><stop offset="1" style="stop-color:var(--heart2)"/></linearGradient></defs><path fill="url(#hg)" d="M12 21s-7.5-4.7-9.6-9.2C.6 8.1 2.4 4.4 5.9 3.6 8.2 3.1 10.4 4 12 5.9c1.6-1.9 3.8-2.8 6.1-2.3 3.5.8 5.3 4.5 3.5 8.2C19.5 16.3 12 21 12 21z"/></svg></span><br /><em>para la carretera.</em></h1>

    <div class="sp2"></div>

    <div class="foot">
      <div class="lockup">

        <div class="wm">Cash<span>Truck</span></div>
      </div>
      <div class="tag">Menos gastos, m&aacute;s camino.</div>
    </div>
  </div>
</div>
<script>
  if (new URLSearchParams(location.search).get('theme') === 'light') {
    document.body.classList.add('light');
  }
</script>
</body>
</html>
